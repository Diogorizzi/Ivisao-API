# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name dartha.api.br www.dartha.api.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — API
server {
    listen 443 ssl;
    http2 on;
    server_name dartha.api.br www.dartha.api.br;

    # SSL (gerenciado pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/dartha.api.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dartha.api.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'" always;

    # Tamanho máximo de upload (documentos)
    client_max_body_size 55M;

    # Bloqueia acesso direto por IP (exige o domínio)
    if ($host !~* ^(dartha\.api\.br|www\.dartha\.api\.br)$) {
        return 444;
    }

    # ── Bloqueia rotas de documentação e painéis de DB que nunca devem ser públicos ──
    location ~* ^/(docs|redoc|openapi\.json|swagger.*|api-docs.*|v[23]/api-docs.*|mongo.*|phpmyadmin|adminer.*|pgadmin4|wp-admin.*|administrator|debug.*|console|actuator.*|logs?|server-status|manager/html|rest/v1) {
        return 404;
    }

    # ── Admin panel — rate limit mais agressivo ─────────────────────────────
    location /admin {
        limit_req  zone=admin_limit burst=5 nodelay;
        limit_conn conn_limit 5;

        proxy_pass         http://api:7777;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── API endpoints ────────────────────────────────────────────────────────
    location / {
        limit_req  zone=api_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass         http://api:7777;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # agentes LLM podem demorar
    }
}
