# Config temporária sem SSL — usada antes de gerar os certificados Let's Encrypt
# Após rodar init-ssl.sh, trocar pelo dartha.conf completo

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name dartha.api.br www.dartha.api.br;

    # Challenge do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req  zone=api_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass         http://api:7777;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 55M;
    }
}
