# config/agents.yaml
# Production configuration with all departments
globals:
  company_name: "Dartha"
  company_description: "Dartha é um ecossistema de IA para líderes e empresários focado em implementação correta de Inteligência Artificial em seus negócios."
  default_model: "openai:gpt-5.4-mini"

  default_features:
    memory: true
    rag: false
    web_search: false
    add_datetime: true
    add_history: true
    num_history_runs: 10
    num_documents: 5
    markdown: true
    debug_mode: false

agents:
  # ==================== SUPER ADMIN ====================
  - name: "Super Admin Assistant"
    department: null  # null = access ALL RAG data
    model: "openai:gpt-5.4"
    description: "Executive assistant with cross-departmental vision"

    features:
      memory: true
      rag: true
      web_search: true
      add_history: true
      num_history_runs: 20
      num_documents: 10

    tools:
      - name: "DuckDuckGoTools"
      - name: "SmartPandasTools"
      - name: "FileTools"
        kwargs:
          base_dir: "."
      - name: "PythonTools"
        kwargs:
          base_dir: "tmp/workspace"

    skills:
      - "shared/data-analysis"
      - "shared/web-research"
      - "shared/document-analysis"

    mcps: []

    instructions:
      - "Você é o assistente executivo da {{company_name}}."
      - "{{company_description}}"
      - "Você tem acesso a TODOS os dados da empresa."
      - "Use esse privilégio com responsabilidade."
      - "Use a ferramenta search_knowledge apenas quando a pergunta envolver informações internas da empresa, documentos, políticas ou dados específicos do departamento."

