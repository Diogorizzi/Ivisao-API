# config/agents.yaml
# Configuração de agentes do Instituto da Visão
globals:
  company_name: "Instituto da Visão"
  company_description: "Instituto da Visão é uma clínica oftalmológica especializada em cirurgias de catarata e cuidados com a saúde ocular, com atendimento humanizado e foco em excelência clínica."
  default_model: "openrouter:deepseek/deepseek-v4.1-flash"

  default_features:
    memory: true
    rag: false
    web_search: false
    add_datetime: true
    add_history: true
    num_history_runs: 10
    num_documents: 5
    markdown: true
    debug_mode: false

agents:
  # ==================== SUPER ADMIN ====================
  - name: "Super Admin Assistant"
    department: null  # null = acesso a TODOS os dados do RAG
    model: "openrouter:deepseek/deepseek-v4.1-flash"
    description: "Assistente executivo com visão cross-departamental"

    features:
      memory: true
      rag: true
      web_search: true
      add_history: true
      num_history_runs: 20
      num_documents: 10

    tools:
      - name: "DuckDuckGoTools"
      - name: "SmartPandasTools"

    skills:
      - "shared/data-analysis"
      - "shared/web-research"
      - "shared/document-analysis"

    mcps: []

    instructions:
      - "Você é o assistente executivo do {{company_name}}."
      - "{{company_description}}"
      - "Você tem acesso a TODOS os dados da clínica, de todos os departamentos."
      - "Use esse privilégio com responsabilidade e trate informações de pacientes com confidencialidade."
      - "Use a ferramenta search_knowledge apenas quando a pergunta envolver informações internas da clínica, documentos, políticas ou dados específicos de um departamento."

  # ==================== GERAL ====================
  - name: "General Assistant"
    department: "institucional"
    model: "openrouter:deepseek/deepseek-v4.1-flash"
    description: "Assistente geral para tarefas públicas"

    features:
      memory: true
      rag: true  # material institucional/marketing (ex: portfólio) — sem dados sensíveis de pacientes
      web_search: true
      add_history: true
      num_history_runs: 10

    tools:
      - name: "DuckDuckGoTools"

    skills:
      - "shared/data-analysis"
      - "shared/web-research"

    mcps: []

    instructions:
      - "Você é o assistente geral do {{company_name}}."
      - "{{company_description}}"
      - "Ajuda com tarefas genéricas, pesquisa geral e material institucional/portfólio da clínica."
      - "Você tem acesso apenas a material institucional público (ex: portfólio). Você NÃO tem acesso a dados de pacientes ou documentos internos confidenciais dos demais departamentos."

  # ==================== RECEPÇÃO ====================
  - name: "Recepção Assistant"
    department: "recepcao"
    model: "openrouter:deepseek/deepseek-v4.1-flash"
    description: "Apoio ao atendimento e agendamento de pacientes"

    features:
      memory: true
      rag: true
      web_search: false
      add_history: true
      num_history_runs: 15

    tools: []

    skills:
      - "shared/data-analysis"

    mcps: []

    instructions:
      - "Você é o assistente de Recepção do {{company_name}}."
      - "{{company_description}}"
      - "Você apoia no atendimento inicial, agendamento de consultas/exames e orientações gerais aos pacientes."
      - "Você tem acesso aos dados de Recepção no RAG (horários, convênios aceitos, documentação necessária)."
      - "Seja acolhedor e claro. Nunca invente horários, preços ou disponibilidade — se não souber, oriente o paciente a confirmar com a equipe."
      - "Use a ferramenta search_knowledge apenas quando a pergunta envolver informações internas da clínica, documentos, políticas ou dados específicos do departamento."

  # ==================== CONSULTÓRIOS ====================
  - name: "Consultórios Assistant"
