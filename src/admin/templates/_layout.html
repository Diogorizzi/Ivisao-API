<!DOCTYPE html>
<html lang="pt-BR" x-data>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin — Knowledge{% endblock %}</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    /* Nav */
    nav { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    nav .brand { font-weight: 700; font-size: 15px; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
    nav .brand span { color: #3b82f6; }
    nav .nav-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #94a3b8; }
    nav a { color: #94a3b8; text-decoration: none; transition: color .15s; }
    nav a:hover { color: #f1f5f9; }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* Breadcrumb */
    .breadcrumb { font-size: 13px; color: #64748b; margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }
    .breadcrumb a { color: #3b82f6; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* Page header */
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    .page-header .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all .15s; text-decoration: none; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-ghost:hover { color: #f1f5f9; border-color: #475569; }

    /* Badge */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-green  { background: #14532d; color: #86efac; }
    .badge-amber  { background: #78350f; color: #fde68a; }
    .badge-red    { background: #7f1d1d; color: #fca5a5; }
    .badge-gray   { background: #1e293b; color: #94a3b8; }

    /* Card */
    .card { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
    .card-body { padding: 20px; }

    /* Table */
    .table-wrap { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f172a; padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #64748b; border-bottom: 1px solid #334155; }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #1e293b; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #162032; }
    .filename-cell { font-weight: 500; color: #f1f5f9; }
    .meta-cell { color: #64748b; font-size: 11px; }

    /* Input */
    .input { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 8px 12px; color: #f1f5f9; font-size: 13px; width: 100%; outline: none; }
    .input:focus { border-color: #3b82f6; }
    .input::placeholder { color: #475569; }

    /* Modal overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 28px; width: 100%; max-width: 480px; }
    .modal h2 { font-size: 17px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .modal .sub { font-size: 12px; color: #64748b; margin-bottom: 20px; }

    /* Drop zone */
    .drop-zone { border: 2px dashed #334155; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: all .15s; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: rgba(59,130,246,.05); }
    .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
    .drop-zone p { font-size: 13px; color: #94a3b8; }
    .drop-zone .hint { font-size: 11px; color: #475569; margin-top: 4px; }

    /* Progress */
    .progress-bar { background: #0f172a; border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
    .progress-fill { background: #3b82f6; height: 100%; border-radius: 4px; transition: width .3s; }

    /* Steps */
    .steps { background: #0f172a; border-radius: 8px; padding: 12px; font-size: 12px; margin-top: 12px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: #64748b; }
    .step.done { color: #22c55e; }
    .step.active { color: #f59e0b; }
    .step.error { color: #ef4444; }

    /* Alert */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; }
    .alert-error { background: #7f1d1d22; border: 1px solid #ef444444; color: #fca5a5; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f59e0b44; border-top-color: #f59e0b; border-radius: 50%; animation: spin .7s linear infinite; }
  </style>
</head>
<body>
<nav>
  <div class="brand">🧠 <span>Dartha</span> Admin</div>
  <div class="nav-right">
    <a href="/admin">Dashboard</a>
    <a href="/admin/logout">Sair</a>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
