<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ company_name }} Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 14px; border: 1px solid #334155; padding: 40px 36px; width: 100%; max-width: 380px; }
    .brand { text-align: center; font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .brand span { color: #3b82f6; }
    .sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 32px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .field { margin-bottom: 20px; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #f1f5f9; font-size: 14px; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background .15s; }
    button:hover { background: #2563eb; }
    .error { background: #7f1d1d22; border: 1px solid #ef444444; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">🧠 <span>{{ company_name }}</span> Admin</div>
    <div class="sub">Painel de Gestão de Knowledge</div>

    {% if request.query_params.get('error') %}
    <div class="error">{{ request.query_params.get('error') }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="field">
        <label>Usuário</label>
        <input type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
