<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eval Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <script>/*__EMBEDDED_DATA__*/</script>
  <style>
    :root {
      --bg: #faf9f5; --surface: #ffffff; --border: #e8e6dc;
      --text: #141413; --muted: #b0aea5; --accent: #d97757;
      --green: #788c5d; --blue: #6a9bcc; --red: #c44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Lora', Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Layout */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { background: var(--text); color: var(--bg); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; }
    .tabs { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab { font-family: 'Poppins', sans-serif; padding: 0.75rem 1.5rem; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .content { flex: 1; overflow-y: auto; padding: 1.5rem; }

    /* Outputs tab */
    .nav-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .nav-btn { font-family: 'Poppins', sans-serif; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: var(--surface); font-size: 0.875rem; font-weight: 500; }
    .nav-btn:hover { background: var(--bg); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    .progress { font-family: 'Poppins', sans-serif; font-size: 0.875rem; color: var(--muted); }
    .run-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; }
    .run-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
    .run-label { font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.25rem; }
    .run-prompt { font-size: 0.9rem; line-height: 1.5; }
    .run-body { padding: 1.5rem; }
    .output-section { margin-bottom: 1.5rem; }
    .output-label { font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.75rem; }
    .file-block { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 0.5rem; }
    .file-name { font-family: 'Poppins', sans-serif; font-size: 0.75rem; padding: 0.4rem 0.75rem; background: var(--border); color: var(--text); font-weight: 500; }
    .file-content { padding: 0.75rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; overflow-x: auto; max-height: 400px; overflow-y: auto; }
    .file-image { max-width: 100%; display: block; }
    .collapsible { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 1rem; }
    .collapsible-header { font-family: 'Poppins', sans-serif; font-size: 0.8rem; font-weight: 500; padding: 0.6rem 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .collapsible-header:hover { background: var(--bg); }
    .collapsible-body { display: none; padding: 1rem; border-top: 1px solid var(--border); }
    .collapsible.open .collapsible-body { display: block; }
    .assertion { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem; }
    .pass-icon { color: var(--green); font-weight: bold; }
    .fail-icon { color: var(--red); font-weight: bold; }
    .feedback-section { margin-top: 1.5rem; }
    .feedback-label { font-family: 'Poppins', sans-serif; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    .feedback-textarea { width: 100%; min-height: 100px; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: 'Lora', Georgia, serif; font-size: 0.875rem; resize: vertical; background: var(--surface); }
    .feedback-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,119,87,0.15); }
    .prev-feedback { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-top: 0.5rem; padding: 0.5rem; background: var(--bg); border-radius: 4px; }
    .submit-btn { font-family: 'Poppins', sans-serif; padding: 0.625rem 1.25rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
    .submit-btn:hover { background: #c4613f; }
    .badge { font-family: 'Poppins', sans-serif; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge-skill { background: #eef2e8; color: var(--green); }
    .badge-baseline { background: #fce9e0; color: var(--accent); }

    /* Benchmark tab */
    .bench-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .bench-section h2 { font-family: 'Poppins', sans-serif; font-size: 1rem; margin-bottom: 1rem; }
    .bench-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .bench-table th { font-family: 'Poppins', sans-serif; background: var(--text); color: var(--bg); padding: 0.5rem 0.75rem; text-align: left; font-weight: 500; font-size: 0.8rem; }
    .bench-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    .delta-positive { color: var(--green); font-weight: bold; }
    .delta-negative { color: var(--red); font-weight: bold; }
    .no-data { color: var(--muted); font-style: italic; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="skill-title">Eval Viewer</h1>
    <button class="submit-btn" onclick="submitAllReviews()">Submit All Reviews</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('outputs', this)">Outputs</div>
    <div class="tab" onclick="switchTab('benchmark', this)">Benchmark</div>
  </div>
  <div class="content" id="content-outputs">
    <div class="nav-bar">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <span class="progress" id="progress-text"></span>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
    <div id="run-display"></div>
  </div>
  <div class="content" id="content-benchmark" style="display:none">
    <div id="benchmark-display"></div>
  </div>
</div>

<script>
const data = EMBEDDED_DATA;
const runs = data.runs || [];
const prevFeedback = data.previous_feedback || {};
const prevOutputs = data.previous_outputs || {};
const benchmark = data.benchmark || null;
const skillName = data.skill_name || "Eval Viewer";

document.getElementById('skill-title').textContent = `Eval Viewer — ${skillName}`;

let currentIdx = 0;
const feedback = {};

// Pre-fill feedback from server
async function loadFeedback() {
  try {
    const resp = await fetch('/api/feedback');
    if (resp.ok) {
      const data = await resp.json();
      (data.reviews || []).forEach(r => { feedback[r.run_id] = r.feedback || ""; });
    }
  } catch {}
  renderRun();
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('content-outputs').style.display = tab === 'outputs' ? 'block' : 'none';
  document.getElementById('content-benchmark').style.display = tab === 'benchmark' ? 'block' : 'none';
  if (tab === 'benchmark') renderBenchmark();
}

function navigate(dir) {
  currentIdx = Math.max(0, Math.min(runs.length - 1, currentIdx + dir));
  renderRun();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

function renderRun() {
  if (!runs.length) {
    document.getElementById('run-display').innerHTML = '<div class="no-data">No runs found.</div>';
    return;
  }

  const run = runs[currentIdx];
  document.getElementById('progress-text').textContent = `${currentIdx + 1} / ${runs.length}`;
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === runs.length - 1;

  const config = run.id.includes('without_skill') ? 'without_skill'
               : run.id.includes('old_skill') ? 'old_skill'
               : 'with_skill';
  const badgeClass = config === 'with_skill' ? 'badge-skill' : 'badge-baseline';
  const badgeLabel = config.replace(/_/g, ' ');

  let html = `
    <div class="run-card">
      <div class="run-header">
        <div class="run-label">Prompt <span class="badge ${badgeClass}">${badgeLabel}</span></div>
        <div class="run-prompt">${escHtml(run.prompt)}</div>
      </div>
      <div class="run-body">
  `;

  // Outputs
  if (run.outputs && run.outputs.length) {
    html += '<div class="output-section"><div class="output-label">Output</div>';
    run.outputs.forEach(f => { html += renderFile(f); });
    html += '</div>';
  }

  // Previous outputs
  const prevOut = prevOutputs[run.id];
  if (prevOut && prevOut.length) {
    html += `<div class="collapsible"><div class="collapsible-header" onclick="toggleCollapsible(this)">Previous Output <span>▼</span></div><div class="collapsible-body">`;
    prevOut.forEach(f => { html += renderFile(f); });
    html += '</div></div>';
  }

  // Grading
  if (run.grading && run.grading.expectations && run.grading.expectations.length) {
    html += `<div class="collapsible"><div class="collapsible-header" onclick="toggleCollapsible(this)">Formal Grades (${run.grading.summary?.passed || 0}/${run.grading.summary?.total || 0} passed) <span>▼</span></div><div class="collapsible-body">`;
    run.grading.expectations.forEach(e => {
      const icon = e.passed ? '<span class="pass-icon">✓</span>' : '<span class="fail-icon">✗</span>';
      html += `<div class="assertion">${icon}<div><strong>${escHtml(e.text)}</strong><br><small style="color:var(--muted)">${escHtml(e.evidence || '')}</small></div></div>`;
    });
    html += '</div></div>';
  }

  // Feedback
  const fb = feedback[run.id] || '';
  const prev = prevFeedback[run.id];
  html += `
    <div class="feedback-section">
      <div class="feedback-label">Feedback</div>
      <textarea class="feedback-textarea" id="fb-${currentIdx}" placeholder="What did you think of this output?"
        oninput="saveFeedback('${run.id}', this.value)">${escHtml(fb)}</textarea>
      ${prev ? `<div class="prev-feedback">Previous: ${escHtml(prev)}</div>` : ''}
    </div>
  `;

  html += '</div></div>';
  document.getElementById('run-display').innerHTML = html;
}

function renderFile(f) {
  if (f.type === 'text') {
    return `<div class="file-block"><div class="file-name">${escHtml(f.name)}</div><div class="file-content">${escHtml(f.content)}</div></div>`;
  } else if (f.type === 'image') {
    return `<div class="file-block"><div class="file-name">${escHtml(f.name)}</div><div style="padding:0.5rem"><img class="file-image" src="${f.data_uri}" alt="${escHtml(f.name)}"></div></div>`;
  } else if (f.type === 'pdf') {
    return `<div class="file-block"><div class="file-name">${escHtml(f.name)}</div><iframe src="${f.data_uri}" style="width:100%;height:500px;border:0"></iframe></div>`;
  } else if (f.type === 'error') {
    return `<div class="file-block"><div class="file-name">${escHtml(f.name)}</div><div class="file-content" style="color:var(--red)">${escHtml(f.content)}</div></div>`;
  } else {
    return `<div class="file-block"><div class="file-name">${escHtml(f.name)}</div><div class="file-content"><a href="${f.data_uri || '#'}" download="${escHtml(f.name)}">Download ${escHtml(f.name)}</a></div></div>`;
  }
}

function toggleCollapsible(header) {
  header.parentElement.classList.toggle('open');
  header.querySelector('span').textContent = header.parentElement.classList.contains('open') ? '▲' : '▼';
}

function saveFeedback(runId, value) {
  feedback[runId] = value;
}

async function submitAllReviews() {
  const reviews = runs.map(r => ({
    run_id: r.id,
    feedback: feedback[r.id] || "",
    timestamp: new Date().toISOString(),
  }));
  const payload = { reviews, status: "complete" };
  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    alert('Reviews submitted!');
  } catch {
    // Headless: download as file
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'feedback.json';
    a.click();
  }
}

function renderBenchmark() {
  const el = document.getElementById('benchmark-display');
  if (!benchmark) {
    el.innerHTML = '<div class="no-data">No benchmark data available. Run aggregate_benchmark.py to generate it.</div>';
    return;
  }

  const rs = benchmark.run_summary || {};
  const configs = Object.keys(rs).filter(k => k !== 'delta');
  const delta = rs.delta || {};
  const meta = benchmark.metadata || {};

  let html = `<div class="bench-section"><h2>Summary — ${escHtml(meta.skill_name || skillName)}</h2>`;

  if (meta.timestamp) html += `<p style="color:var(--muted);font-size:0.8rem;margin-bottom:1rem">Timestamp: ${meta.timestamp} | Model: ${meta.executor_model || '?'}</p>`;

  html += `<table class="bench-table"><thead><tr><th>Metric</th>`;
  configs.forEach(c => { html += `<th>${escHtml(c.replace(/_/g, ' '))}</th>`; });
  html += `<th>Delta</th></tr></thead><tbody>`;

  ['pass_rate', 'time_seconds', 'tokens'].forEach(metric => {
    const label = { pass_rate: 'Pass Rate', time_seconds: 'Time (s)', tokens: 'Tokens' }[metric];
    const fmt = metric === 'pass_rate'
      ? v => `${(v * 100).toFixed(0)}%`
      : v => v.toFixed(metric === 'time_seconds' ? 1 : 0);
    html += `<tr><td>${label}</td>`;
    configs.forEach(c => {
      const s = rs[c]?.[metric] || {};
      html += `<td>${fmt(s.mean || 0)} ± ${fmt(s.stddev || 0)}</td>`;
    });
    const d = delta[metric] || '—';
    const dClass = d.startsWith('+') && metric === 'pass_rate' ? 'delta-positive'
                 : d.startsWith('-') && metric === 'pass_rate' ? 'delta-negative' : '';
    html += `<td class="${dClass}">${d}</td></tr>`;
  });

  html += `</tbody></table></div>`;

  if (benchmark.notes && benchmark.notes.length) {
    html += `<div class="bench-section"><h2>Analyst Notes</h2><ul style="padding-left:1.5rem">`;
    benchmark.notes.forEach(n => { html += `<li style="margin-bottom:0.5rem">${escHtml(n)}</li>`; });
    html += `</ul></div>`;
  }

  el.innerHTML = html;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Init
if (window.location.protocol === 'file:') {
  // Static mode: no server
  renderRun();
} else {
  loadFeedback();
}
</script>
</body>
</html>
