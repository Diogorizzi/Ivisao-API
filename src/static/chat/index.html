<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistentes — Instituto da Visão</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #0f6e8c;
    --blue-dark: #0b5266;
    --blue-light: #e6f3f6;
    --bg: #f4f7f8;
    --panel: #ffffff;
    --border: #dde5e7;
    --text: #1f2a2e;
    --muted: #6b7c80;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #sidebar header {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar header .brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--blue-dark);
  }
  #sidebar header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #dept-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }
  #dept-list li {
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 2px;
    transition: background .12s;
  }
  #dept-list li:hover { background: var(--blue-light); }
  #dept-list li.active { background: var(--blue); color: #fff; font-weight: 600; }
  #user-box {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  #user-box b { color: var(--text); }
  #user-box a { color: var(--blue); cursor: pointer; text-decoration: none; }

  /* ---------- Chat area ---------- */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #chat-header .name { font-size: 16px; font-weight: 700; }
  #chat-header .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    max-width: 320px;
  }
  .msg { max-width: 70%; padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.agent { align-self: flex-start; max-width: 78%; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  /* Markdown nas respostas dos assistentes */
  .msg.agent > :first-child { margin-top: 0; }
  .msg.agent > :last-child { margin-bottom: 0; }
  .msg.agent p, .msg.agent ul, .msg.agent ol, .msg.agent pre, .msg.agent blockquote, .msg.agent .table-wrap { margin: 0 0 10px; }
  .msg.agent h1, .msg.agent h2, .msg.agent h3, .msg.agent h4, .msg.agent h5, .msg.agent h6 { margin: 14px 0 6px; line-height: 1.3; color: var(--blue-dark); }
  .msg.agent h1 { font-size: 1.25em; }
  .msg.agent h2 { font-size: 1.15em; }
  .msg.agent h3 { font-size: 1.05em; }
  .msg.agent h4, .msg.agent h5, .msg.agent h6 { font-size: 1em; }
  .msg.agent ul, .msg.agent ol { padding-left: 22px; }
  .msg.agent li { margin: 2px 0; }
  .msg.agent li > ul, .msg.agent li > ol { margin: 4px 0; }
  .msg.agent code { background: var(--blue-light); padding: 1px 5px; border-radius: 4px; font-family: Consolas, 'Courier New', monospace; font-size: .92em; }
  .msg.agent pre { background: #f0f4f5; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .msg.agent pre code { background: none; padding: 0; }
  .msg.agent blockquote { border-left: 3px solid var(--blue); padding-left: 12px; color: var(--muted); }
  .msg.agent hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .msg.agent a { color: var(--blue); }
  .msg.agent .table-wrap { overflow-x: auto; }
  .msg.agent table { border-collapse: collapse; font-size: 13px; }
  .msg.agent th, .msg.agent td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  .msg.agent th { background: var(--blue-light); }
  .msg.pending { align-self: flex-start; color: var(--muted); font-style: italic; }
  .msg.error { align-self: flex-start; background: #fdecea; border: 1px solid #f5c2c0; color: #a33; }

  #input-bar {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 10px;
  }
  #input-bar textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    max-height: 120px;
  }
  #input-bar textarea:focus { border-color: var(--blue); }
  #input-bar button {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #input-bar button:hover { background: var(--blue-dark); }
  #input-bar button:disabled { background: #a9c3ca; cursor: not-allowed; }

  /* ---------- Name prompt modal ---------- */
  #name-modal {
    position: fixed; inset: 0; background: rgba(15,25,29,.5);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #name-modal .card {
    background: #fff; border-radius: 12px; padding: 30px 32px; width: 100%; max-width: 340px;
  }
  #name-modal h2 { font-size: 16px; margin-bottom: 6px; }
  #name-modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  #name-modal input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none; margin-bottom: 14px;
  }
  #name-modal input:focus { border-color: var(--blue); }
  #name-modal button {
    width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #name-modal.hidden { display: none; }
</style>
</head>
<body>

<div id="sidebar">
  <header>
    <div class="brand">👁 Instituto da Visão</div>
    <div class="sub">Assistentes internos</div>
  </header>
  <ul id="dept-list"></ul>
  <div id="user-box">
    Conectado como <b id="user-name-label">—</b><br>
    <a id="change-name">trocar nome</a>
  </div>
</div>

<div id="chat-area">
  <div id="chat-header">
    <div class="name" id="chat-header-name">Selecione um assistente</div>
    <div class="desc" id="chat-header-desc"></div>
  </div>
  <div id="messages"><div class="empty-state">Escolha um departamento ao lado para começar a conversar.</div></div>
  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Digite sua pergunta..." disabled></textarea>
    <button id="send-btn" disabled>Enviar</button>
  </div>
</div>

<div id="name-modal">
  <div class="card">
    <h2>Bem-vindo(a)</h2>
    <p>Digite seu nome para identificar suas conversas com os assistentes.</p>
    <input id="name-input" type="text" placeholder="Seu nome" maxlength="60">
    <button id="name-submit">Entrar</button>
  </div>
</div>

<script>
const STORAGE_USER = "ivisao_chat_user";
const STORAGE_SESSIONS = "ivisao_chat_sessions"; // { [agentId]: sessionId }

let userName = localStorage.getItem(STORAGE_USER) || "";
let sessions = JSON.parse(localStorage.getItem(STORAGE_SESSIONS) || "{}");
let agents = [];
let activeAgent = null;
let conversations = {}; // { [agentId]: [{role, text}] }

const nameModal = document.getElementById("name-modal");
const nameInput = document.getElementById("name-input");
const nameSubmit = document.getElementById("name-submit");
const userNameLabel = document.getElementById("user-name-label");
const changeNameLink = document.getElementById("change-name");
const deptList = document.getElementById("dept-list");
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const chatHeaderName = document.getElementById("chat-header-name");
const chatHeaderDesc = document.getElementById("chat-header-desc");

function showNameModal() {
  nameModal.classList.remove("hidden");
  nameInput.value = userName;
  nameInput.focus();
}
function hideNameModal() { nameModal.classList.add("hidden"); }

function saveUserName(name) {
  userName = name.trim();
  if (!userName) return;
  localStorage.setItem(STORAGE_USER, userName);
  userNameLabel.textContent = userName;
  hideNameModal();
}

nameSubmit.addEventListener("click", () => saveUserName(nameInput.value));
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") saveUserName(nameInput.value); });
changeNameLink.addEventListener("click", showNameModal);

function persistSessions() {
  localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(sessions));
}

async function loadAgents() {
  const res = await fetch("/agents");
  agents = await res.json();
  // Esconde o Super Admin da lista de uso diário da equipe (acesso total demais para o dia a dia)
  agents = agents.filter(a => a.id !== "super-admin-assistant");
  renderDeptList();
}

function displayName(agent) {
  return agent.name.replace(/ Assistant$/, "");
}

function renderDeptList() {
  deptList.innerHTML = "";
  agents.forEach(agent => {
    const li = document.createElement("li");
    li.textContent = displayName(agent);
    li.dataset.agentId = agent.id;
    if (activeAgent && activeAgent.id === agent.id) li.classList.add("active");
    li.addEventListener("click", () => selectAgent(agent));
    deptList.appendChild(li);
  });
}

function selectAgent(agent) {
  activeAgent = agent;
  renderDeptList();
  chatHeaderName.textContent = displayName(agent);
  chatHeaderDesc.textContent = agent.description || "";
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
  renderMessages();
}

// ---------- Markdown (renderizador próprio: escapa todo HTML antes de formatar) ----------
const MD_LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const MD_HR_RE = /^\s*([-*_])(\s*\1){2,}\s*$/;
const MD_TABLE_SEP_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderInline(text) {
  const codes = [];
  text = text.replace(/\u0000/g, "").replace(/`([^`\n]+)`/g, (_, c) => {
    codes.push(c);
    return "\u0000" + (codes.length - 1) + "\u0000";
  });
  // <br> é a única tag HTML aceita (modelos usam dentro de células de tabela); o resto é escapado
  text = escapeHtml(text.replace(/\u0001/g, "").replace(/<br\s*\/?>/gi, "\u0001")).replace(/\u0001/g, "<br>");
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w])__(?!\s)([^_\n]+?)__(?!\w)/g, "$1<strong>$2</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_(?!\s)([^_\n]+?)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
}

function mdSplitRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
}

function mdBuildList(items) {
  let html = "";
  const stack = [];
  for (const it of items) {
    const tag = it.ordered ? "ol" : "ul";
    while (stack.length && it.indent < stack[stack.length - 1].indent) {
      html += "</li></" + stack.pop().tag + ">";
    }
    if (stack.length && it.indent === stack[stack.length - 1].indent && tag !== stack[stack.length - 1].tag) {
      html += "</li></" + stack.pop().tag + ">";
    }
    if (!stack.length || it.indent > stack[stack.length - 1].indent) {
      html += "<" + tag + ">";
      stack.push({ indent: it.indent, tag });
    } else {
      html += "</li>";
    }
    html += "<li>" + renderInline(it.text);
  }
  while (stack.length) html += "</li></" + stack.pop().tag + ">";
  return html;
}

function renderMarkdown(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  const startsBlock = (idx) => {
    const l = lines[idx];
    return /^\s*```/.test(l) || /^#{1,6}\s/.test(l) || MD_HR_RE.test(l) || MD_LIST_RE.test(l)
      || /^\s*>/.test(l)
      || (l.includes("|") && idx + 1 < lines.length && MD_TABLE_SEP_RE.test(lines[idx + 1]));
  };

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    if (/^\s*```/.test(line)) {
      const code = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      out.push("<h" + h[1].length + ">" + renderInline(h[2].trim()) + "</h" + h[1].length + ">");
      i++;
      continue;
    }

    if (MD_HR_RE.test(line)) { out.push("<hr>"); i++; continue; }

    if (/^\s*>/.test(line)) {
      const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + renderMarkdown(q.join("\n")) + "</blockquote>");
      continue;
    }

    if (line.includes("|") && i + 1 < lines.length && MD_TABLE_SEP_RE.test(lines[i + 1])) {
      const head = mdSplitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) rows.push(mdSplitRow(lines[i++]));
      out.push('<div class="table-wrap"><table><thead><tr>'
        + head.map(c => "<th>" + renderInline(c) + "</th>").join("")
        + "</tr></thead><tbody>"
        + rows.map(r => "<tr>" + r.map(c => "<td>" + renderInline(c) + "</td>").join("") + "</tr>").join("")
        + "</tbody></table></div>");
      continue;
    }

    if (MD_LIST_RE.test(line)) {
      const items = [];
      while (i < lines.length) {
        const lm = lines[i].match(MD_LIST_RE);
        if (lm) {
          items.push({ indent: lm[1].replace(/\t/g, "    ").length, ordered: /\d/.test(lm[2]), text: lm[3] });
          i++;
        } else if (items.length && /^\s+\S/.test(lines[i]) && !/^\s*```/.test(lines[i])) {
          items[items.length - 1].text += " " + lines[i].trim();
          i++;
        } else if (!lines[i].trim() && i + 1 < lines.length && MD_LIST_RE.test(lines[i + 1])) {
          i++;
        } else {
          break;
        }
      }
      out.push(mdBuildList(items));
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() && (para.length === 0 || !startsBlock(i))) para.push(lines[i++]);
    out.push("<p>" + para.map(renderInline).join("<br>") + "</p>");
  }
  return out.join("");
}

function renderMessages() {
  const list = conversations[activeAgent.id] || [];
  messagesEl.innerHTML = "";
  if (list.length === 0) {
    messagesEl.innerHTML = '<div class="empty-state">Envie uma mensagem para começar a conversar com ' + displayName(activeAgent) + '.</div>';
    return;
  }
  list.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    if (m.role === "agent") div.innerHTML = renderMarkdown(m.text);
    else div.textContent = m.text;
    messagesEl.appendChild(div);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !activeAgent) return;

  if (!conversations[activeAgent.id]) conversations[activeAgent.id] = [];
  conversations[activeAgent.id].push({ role: "user", text });
  inputEl.value = "";
  autoResize();
  renderMessages();

  const pending = document.createElement("div");
  pending.className = "msg pending";
  pending.textContent = "digitando...";
  messagesEl.appendChild(pending);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  sendBtn.disabled = true;

  const form = new FormData();
  form.append("message", text);
  form.append("user_id", userName);
  form.append("stream", "false");
  if (sessions[activeAgent.id]) form.append("session_id", sessions[activeAgent.id]);

  try {
    const res = await fetch(`/agents/${encodeURIComponent(activeAgent.id)}/runs`, {
      method: "POST",
      body: form,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.session_id) {
      sessions[activeAgent.id] = data.session_id;
      persistSessions();
    }
    conversations[activeAgent.id].push({ role: "agent", text: data.content || "(sem resposta)" });
  } catch (err) {
    conversations[activeAgent.id].push({ role: "error", text: "Erro ao falar com o assistente: " + err.message });
  } finally {
    sendBtn.disabled = false;
    renderMessages();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}
inputEl.addEventListener("input", autoResize);

// ---------- Boot ----------
if (userName) {
  userNameLabel.textContent = userName;
} else {
  showNameModal();
}
loadAgents();
</script>
</body>
</html>
